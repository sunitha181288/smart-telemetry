spring.application.name=telemetry-service

mqtt.broker-url=tcp://localhost:1883
mqtt.client-id=telemetry-service
mqtt.topic=smartroom/telemetry/#
mqtt.qos=1

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.group-id=telemetry-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.smartroom.telemetry_service.model.SensorReading
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

kafka.topic.telemetry=room-telemetry

spring.datasource.url=jdbc:postgresql://localhost:5432/smartroom
spring.datasource.username=smartroom
spring.datasource.password=smartroom
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.integration.mqtt=DEBUG
logging.level.com.smartroom.telemetry_service=DEBUG
